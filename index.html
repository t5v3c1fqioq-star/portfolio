<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sadeq Al-Kaabi · Filmmaker & Senior Video Editor</title>
<meta name="description" content="Sadeq Khalid Al-Kaabi — filmmaker and senior video editor in Baghdad. صادق خالد الكعبي، صانع أفلام ومونتير أول في بغداد.">
<meta property="og:title" content="Sadeq Al-Kaabi · Filmmaker">
<meta property="og:description" content="Cinematic films, TV commercials and brand videos from Baghdad · أفلام وإعلانات من بغداد">
<meta property="og:image" content="media/th-tvc-eid.jpg">
<meta name="theme-color" content="#121212">
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Barlow:wght@300;400;500&family=Barlow+Semi+Condensed:wght@500&family=Tajawal:wght@300;400;500;700&display=swap">
<style>
/* Layout: an editing suite — slim sticky nav, one page per body of work (hash routes), viewfinder-framed showreel, timeline rulers between blocks, captions under the work. Single dark (cinema) theme by choice. */
:root{
  --bg:#121212; --surface:#1B1B1B; --line:#2E2E2E; --fg:#F2F1EE; --muted:#9C9A97; --gold:#E0241E; --rec:#E0241E;
  --serif:"Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --sans:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Barlow Semi Condensed", "Barlow", ui-monospace, Menlo, monospace;
  --ar:"Tajawal", "Geeza Pro", Tahoma, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--sans);font-weight:400;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.ar{font-family:var(--ar);direction:rtl;font-weight:400}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;text-wrap:balance;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
em{font-style:normal;color:var(--gold)}

/* NAV */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(18,18,18,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:24px;height:62px}
.brand{font-family:var(--serif);font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.links{display:flex;gap:clamp(12px,1.4vw,22px);align-items:center;margin-left:auto;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent;transition:color .3s}
.links a:hover{color:var(--fg)}
.links a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--gold)}

main{min-height:70vh}
.page-in{}
@keyframes fade{from{opacity:.0001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HOME */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(28px,5vw,72px);align-items:center;padding-block:clamp(40px,6vw,80px);background:radial-gradient(ellipse at 75% 45%,rgba(255,255,255,.06),transparent 60%)}
.cutout{position:relative;margin:0 auto;width:100%;max-width:460px;align-self:center}
.cutout img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent);mask-image:linear-gradient(to bottom,#000 82%,transparent)}
.cutout .label{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cutout .rec{display:inline-flex;align-items:center;gap:8px}
.reel{padding-bottom:clamp(52px,7vw,96px)}
.about-photo img{width:100%;max-width:360px;height:auto;display:block;margin:0 auto 22px;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent);mask-image:linear-gradient(to bottom,#000 82%,transparent)}
.hero h1{font-size:clamp(44px,6.2vw,96px);font-weight:300;letter-spacing:.02em}
.hero h1 span{display:block;color:var(--gold)}
.hero .ar{font-size:17px;color:var(--muted);margin-top:14px}
.hero p{max-width:44ch;color:var(--muted);margin:22px 0 0}
.frame{position:relative;border:1px solid var(--line);padding:10px;background:var(--surface)}
.vf{position:absolute;inset:22px;pointer-events:none;z-index:1}
.vf i{position:absolute;width:26px;height:26px;border-color:rgba(238,232,220,.75);border-style:solid}
.vf i:nth-child(1){top:0;left:0;border-width:2px 0 0 2px}.vf i:nth-child(2){top:0;right:0;border-width:2px 2px 0 0}.vf i:nth-child(3){bottom:0;left:0;border-width:0 0 2px 2px}.vf i:nth-child(4){bottom:0;right:0;border-width:0 2px 2px 0}
.hud{position:absolute;top:34px;left:36px;right:36px;display:flex;justify-content:space-between;gap:10px;z-index:1;color:var(--fg)}
.rec{display:inline-flex;align-items:center;gap:7px}.rec b{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.ruler{height:42px;border-top:1px solid var(--line);position:relative;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) top/100% 9px no-repeat,repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 120px) top/100% 16px no-repeat}
.ruler span{position:absolute;top:19px;left:max(16px,env(safe-area-inset-left,0px))}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}.stats div{display:flex;gap:8px;align-items:baseline}.stats strong{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--gold);line-height:1}
.frame video,.frame img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.frame .label{position:absolute;bottom:-26px;left:0}
.more{display:inline-flex;gap:10px;align-items:center;margin-top:26px;border:1px solid var(--fg);padding:10px 18px;font-weight:400;letter-spacing:.04em;transition:background .2s,color .2s}.more:hover{background:var(--fg);color:var(--bg)}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.block{padding-block:clamp(52px,7vw,96px)}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:32px}
.block-head h2{font-size:clamp(32px,4.2vw,56px)}
.index a{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:baseline;padding:22px 0;border-top:1px solid var(--line);transition:padding .4s}
.index a:last-child{border-bottom:1px solid var(--line)}
.index a:hover{padding-left:10px}
.index h3{font-size:clamp(22px,2.6vw,36px)}
.index .ar{color:var(--muted);font-size:15px}
.index .count{font-family:var(--mono);font-size:12px;color:var(--gold)}

/* WORK GRID */
.page-head{padding-block:clamp(48px,7vw,92px) clamp(28px,4vw,48px);display:grid;gap:12px;max-width:760px}
.page-head h1{font-size:clamp(38px,5.4vw,76px)}
.page-head .ar{font-size:18px;color:var(--muted)}
.page-head p{color:var(--muted);margin:6px 0 0;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.4vw,32px) clamp(14px,2vw,28px);grid-auto-flow:dense;padding-bottom:clamp(60px,8vw,110px)}
.work{display:grid;gap:12px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.work.h{grid-column:span 2}
.media{position:relative;overflow:hidden;background:var(--surface)}
.work.v .media{aspect-ratio:4/5}
.work.h .media{aspect-ratio:16/9}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.6,.2,1),opacity .6s}
.work:hover .media img,.work:hover .media video{transform:scale(1.025)}
.meta{display:grid;gap:2px}
.meta h3{font-size:clamp(17px,1.5vw,21px)}
.meta .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.meta .ar{font-size:14px;color:var(--muted)}
.meta .note{font-size:13px;color:var(--muted)}
.empty{border:1px solid var(--line);padding:48px 24px;text-align:center;color:var(--muted);margin-bottom:96px}
.empty h3{font-size:30px;color:var(--fg);margin-bottom:8px}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.tools button{background:rgba(17,16,14,.85);border:1px solid var(--line);padding:4px 9px;font-size:12px;cursor:pointer}
.tools .del{color:#E08A7E}
.add{border:1px dashed var(--muted);background:none;color:var(--muted);aspect-ratio:4/5;cursor:pointer;font-family:var(--serif);font-size:24px;font-weight:500;text-transform:uppercase}
.tc{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10.5px;background:rgba(5,6,9,.6);padding:3px 6px;letter-spacing:.06em;z-index:1}

/* CLIENTS */
.logos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.logo{border-right:1px solid var(--line);border-bottom:1px solid var(--line);aspect-ratio:4/3;display:grid;place-items:center;padding:clamp(16px,2.4vw,34px);position:relative}
.logo img{max-height:clamp(40px,5.2vw,76px);max-width:78%;width:auto;height:auto;object-fit:contain;margin-bottom:16px}
.logo{overflow:hidden}
.logo:hover img{opacity:1}
.logo span{position:absolute;bottom:10px;left:6px;right:6px;text-align:center;font-size:11px;color:var(--muted)}
.logo:hover{background:var(--surface)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.more.solid{background:var(--rec);border-color:var(--rec);color:#fff;cursor:pointer;font:inherit;font-weight:400;letter-spacing:.04em}
.more.solid:hover,.more.solid.on{background:#b81b16;border-color:#b81b16;color:#fff}
.reach-pop{margin-top:18px;animation:pop .35s ease}
.reach-pop .reach a.wide{grid-column:1/-1}
.reach-pop .reach{grid-template-columns:1fr 1fr;margin:0;gap:10px}
.reach-pop .reach a{padding:14px 16px}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sndctl{display:flex;align-items:center;gap:8px;background:rgba(10,10,10,.72);backdrop-filter:blur(8px);border:1px solid var(--line);padding:6px 10px 6px 6px;border-radius:999px}
.frame .sndctl{position:absolute;right:14px;top:14px;z-index:3}
.lb-in{position:relative}.lb-in .sndctl{position:absolute;right:12px;top:12px;z-index:3}
.snd-t{width:34px;height:34px;border-radius:50%;border:0;background:var(--rec);display:grid;place-items:center;cursor:pointer;padding:0}
.snd-t svg{width:18px;height:18px;fill:#fff}.snd-t.off{background:#333}
.snd-r{width:96px;accent-color:var(--rec);cursor:pointer}
.gsnd{position:fixed;left:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:10px}
.gsnd .hint{display:none;background:rgba(10,10,10,.8);padding:6px 10px;border-radius:999px;color:var(--fg)}
.gsnd.needs .hint{display:inline-block}.gsnd.needs .snd-t{animation:blink 1.2s steps(2) infinite}
.frame{position:relative}
.films{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(18px,2.4vw,32px)}
.film{display:grid;gap:14px;align-content:start}
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.film:hover .poster img{transform:scale(1.03)}
.poster .yr{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;background:rgba(10,10,10,.75);padding:4px 8px}
.film h3{font-size:clamp(20px,1.8vw,26px)}.film h3 small{font-size:.6em;color:var(--muted)}
.film .note{font-size:13px;color:var(--muted)}
.own{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(18px,2.4vw,32px);align-items:start;margin-bottom:clamp(36px,5vw,64px)}
.bts{margin:0;display:grid;gap:10px}.bts img{width:100%;display:block;border:1px solid var(--line)}
@media (max-width:900px){.films{grid-template-columns:repeat(2,minmax(0,1fr))}.own{grid-template-columns:1fr}}
.reach{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:clamp(40px,6vw,80px)}
.reach a{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;padding:18px 20px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s,background .2s}
.reach a:hover{border-color:var(--rec);background:#221616}
.reach svg{grid-row:span 2;width:26px;height:26px;fill:var(--rec)}
.reach b{font-weight:500;font-family:var(--serif);text-transform:uppercase;letter-spacing:.06em;font-size:18px}
.reach small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.reach{grid-template-columns:1fr 1fr}}
.strip{display:flex;flex-wrap:wrap;gap:28px 48px;align-items:center}
.strip img{height:34px;width:auto;opacity:.75}

/* ABOUT */
.about{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(28px,5vw,80px);padding-bottom:clamp(60px,8vw,110px)}
.about p{margin:0 0 14px;max-width:60ch}
.exp div{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.exp div:last-child{border-bottom:1px solid var(--line)}
.exp b{font-weight:400}.exp small{display:block;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);padding:6px 12px;font-size:13px}

/* CONTACT */
.contact{display:grid;gap:0;max-width:760px;padding-bottom:clamp(60px,8vw,110px)}
.contact div{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:18px 0;border-top:1px solid var(--line)}
.contact div:last-child{border-bottom:1px solid var(--line)}
.contact .val{font-size:clamp(16px,1.6vw,20px);user-select:all;word-break:break-all}
.copy{background:none;border:1px solid var(--line);padding:3px 10px;font-size:12px;cursor:pointer;margin-left:auto}
footer{border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px}

/* LIGHTBOX */
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,6,9,.95);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .4s ease both}
.lb-in{display:grid;gap:16px;justify-items:center;width:100%;max-width:1100px}
.lb video{max-width:100%;max-height:76vh;background:#000}
.lb .x{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:none;border:1px solid var(--line);padding:6px 14px;cursor:pointer}
.lb h3{font-size:clamp(22px,2.4vw,30px);text-align:center}
.lb .ar,.lb .label{text-align:center;display:block}

/* EDITOR */
.editbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:8px;max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.editbar button{background:none;border:1px solid var(--line);padding:8px 14px;cursor:pointer}
.editbar .primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.editbar .status{font-size:13px;color:var(--muted);padding:0 6px}
dialog{background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:0;width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(5,6,9,.8)}
.form{display:grid;gap:14px;padding:24px}
.form h3{font-size:32px}
.form label{display:grid;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.form input,.form select,.form textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:10px;font:inherit;font-size:15px;width:100%}
.form textarea{min-height:88px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .btns{display:flex;gap:10px;justify-content:flex-end}
.form .btns button{border:1px solid var(--line);background:none;padding:9px 16px;cursor:pointer}
.form .btns .primary{background:var(--gold);color:#fff;border-color:var(--gold)}
.form .err{color:#E08A7E;font-size:14px;min-height:1em}
.form video{max-height:180px;justify-self:start}

@media (max-width:900px){.hero,.about{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.logos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:540px){.grid{grid-template-columns:1fr 1fr;gap:18px 10px}.work.h{grid-column:span 2}.logos{grid-template-columns:repeat(2,minmax(0,1fr))}.exp div{grid-template-columns:1fr;gap:2px}.form .two{grid-template-columns:1fr}.index a{grid-template-columns:1fr auto}.index .ar{display:none}nav .wrap{gap:14px}.brand{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:600px){.frame .sndctl{top:8px;right:8px;padding:4px 8px 4px 4px}.frame .snd-r{width:60px}.snd-t{width:28px;height:28px}}
/* ===== cinematic FX ===== */
.grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:90;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vign{position:fixed;inset:0;pointer-events:none;z-index:89;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
.lbx{position:fixed;left:0;right:0;height:0;background:#000;z-index:120;pointer-events:none;transition:height .45s cubic-bezier(.7,0,.2,1)}
.lbx.t{top:0}.lbx.b{bottom:0}.cutting .lbx{height:50.5vh}
.playhead{position:fixed;left:0;top:0;height:2px;background:var(--rec);z-index:60;width:0;box-shadow:0 0 12px var(--rec)}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.1,1)}
.rv.in{opacity:1;transform:none}
.work.rv .media::after,.film.rv .poster::after{content:"";position:absolute;inset:0;background:var(--rec);transform-origin:right;transform:scaleX(1);transition:transform .9s cubic-bezier(.7,0,.2,1) .15s;z-index:4;pointer-events:none}
.work.rv.in .media::after,.film.rv.in .poster::after{transform:scaleX(0)}
.work .media{position:relative}
.hero h1 span.w{display:inline-block;overflow:hidden;vertical-align:top;color:inherit}
.hero h1 .w>i{display:inline-block;font-style:normal;transform:translateY(110%);animation:rise 1.1s cubic-bezier(.2,.7,.1,1) forwards}
@keyframes rise{to{transform:none}}
.cutout img{transition:transform .25s ease-out;will-change:transform}
.cursor{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;z-index:130;display:grid;place-items:center;font:500 10px/1 var(--mono);letter-spacing:.14em;color:#fff;transition:width .3s,height .3s,margin .3s,background .3s,border-color .3s;mix-blend-mode:normal}
.cursor span{opacity:0;transition:opacity .2s}
.cursor.big{width:86px;height:86px;margin:-43px 0 0 -43px;background:rgba(224,36,30,.85);border-color:transparent}.cursor.big span{opacity:1}
@media (hover:none),(pointer:coarse){.cursor{display:none}}
.work .media,.poster{transform-style:preserve-3d;transition:transform .35s ease}
.intro{position:fixed;inset:0;z-index:200;background:#050505;display:grid;place-items:center;color:#fff;cursor:pointer;transition:opacity .6s}

function pageCat(id){const c=DATA.categories.find(x=>x[0]===id);const list=DATA.projects.filter(p=>p.cat===id);if(id==="cinema"&&(DATA.films||[]).length)return pageFilms(c,list);

function pageClients(){return `<section class="wrap page-head"><span class="label">${DATA.logos.length} ${T("clients","عميل")}</span><h1>${T("Clients","العملاء")}</h1><span class="ar">${T("Who I have worked with","جهات اشتغلت وياها")}</span><p>${T("Developers, broadcasters, schools and brands across Iraq.","شركات تطوير عقاري، قنوات، مدارس وبراندات بكل العراق.")}</p></section>

function pageAbout(){const P=DATA.profile;return `<section class="wrap page-head"><span class="label">${T("About","عني")}</span><h1>${T("Behind the <em>cut</em>","ورا <em>القطع</em>")}</h1><span class="ar">${T("From the shoot to the final cut","من التصوير إلى المونتاج")}</span></section>

    <div class="exp" style="margin-top:28px">${DATA.experience.map(e=>`<div><span class="label">${esc(e[0])}</span><span><b>${esc(AR()?(e[3]||e[1]):e[1])}</b><small>${esc(AR()?(e[4]||e[2]):e[2])}</small></span></div>`).join("")}</div></div>

function pageContact(){const P=DATA.profile;return `<section class="wrap page-head"><span class="label">${T("Contact","تواصل")}</span><h1>${T("Let's make <em>something</em>","خلّي نسوي <em>شي حلو</em>")}</h1><span class="ar">${T("Usually replies within a day","عادةً أرد خلال يوم")}</span></section>
  <section class="wrap" style="padding-bottom:40px">${reach()}<a class="more cvbtn" href="${cvLink()}" download target="_blank" rel="noopener" style="margin-top:18px">${T("Download CV (PDF)","تحميل السيرة الذاتية PDF")} <span aria-hidden="true">↓</span></a></section>

function tcOf(i){const s=(i+1)*4;return `00:0${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}:00`;}
function render(){const r=route();
  const body=r==="home"?pageHome():r==="clients"?pageClients():r==="about"?pageAbout():r==="contact"?pageContact():pageCat(r);
  $("#app").innerHTML=nav(r)+`<main class="page-in" id="main">${body}</main><footer><div class="wrap"><span class="label">© ${esc(L(DATA.profile,"name"))}</span><button class="label replay" type="button" id="replayBtn">▶ ${T("Replay intro","إعادة الانترو")}</button><a class="label" href="#contact">${esc(DATA.profile.email)}</a></div></footer>`+(canEdit?editbar():"");
  wire();}
function editbar(){return `<div class="editbar">${editing?`<button id="profBtn">Edit profile</button><button id="addBtn">+ Add video</button><span class="status" id="status">${dirty?"Unsaved changes":"All saved"}</span><button class="primary" id="saveBtn" ${dirty?"":"disabled"}>Publish changes</button><button id="doneBtn">Done</button>`:`<button class="primary" id="editBtn">Edit portfolio</button>`}</div>`;}

let io;
function wire(){
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="Copied";}catch(e){const v=b.previousElementSibling,r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected";}});
  document.querySelectorAll(".mailtgl").forEach(m=>m.onclick=e=>{e.preventDefault();const o=m.nextElementSibling;o.hidden=!o.hidden;m.classList.toggle("on",!o.hidden);});
  document.querySelectorAll("[data-copy-mail]").forEach(b=>b.onclick=async()=>{const v=b.dataset.copyMail;let ok=false;try{await navigator.clipboard.writeText(v);ok=true;}catch(e){try{const t=document.createElement("textarea");t.value=v;document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove();}catch(_){}}b.textContent=ok?T("Copied ✓","تم النسخ ✓"):v;setTimeout(()=>b.textContent=T("Copy address","نسخ الإيميل"),2200);});
  {const cb=document.getElementById("contactBtn"),rp=document.getElementById("reachPanel");if(cb&&rp)cb.addEventListener("click",()=>{const o=rp.hidden;rp.hidden=!o;cb.setAttribute("aria-expanded",String(o));cb.classList.toggle("on",o);});}
  document.querySelectorAll(".work").forEach(c=>{c.addEventListener("click",e=>{if(e.target.closest(".tools"))return;openLB(+c.dataset.i);});c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLB(+c.dataset.i);}});});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.i;
    if(b.dataset.act==="del"){if(b.dataset.sure){DATA.projects.splice(i,1);mark();}else{b.dataset.sure=1;b.textContent="Sure?";}}
    if(b.dataset.act==="up"){const a=DATA.projects,cat=a[i].cat;let j=i-1;while(j>=0&&a[j].cat!==cat)j--;if(j>=0){[a[j],a[i]]=[a[i],a[j]];mark();}}
    if(b.dataset.act==="edit")openForm(i);});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openForm(-1,b.dataset.add));
  if(io)io.disconnect();
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches&&"IntersectionObserver" in window){
    io=new IntersectionObserver(es=>es.forEach(en=>{const v=en.target.querySelector("video");if(!v)return;
      if(HOVERDEV)return;
      if(en.isIntersecting){if(!v.src)v.src=v.dataset.src;v.play().then(()=>{const im=en.target.querySelector("img");if(im)im.style.opacity=0;}).catch(()=>{});}else v.pause();}),{threshold:.5});
    const obs=()=>document.querySelectorAll(".work .media").forEach(m=>io.observe(m));if(CUTTING)setTimeout(obs,700);else obs();}
  document.querySelectorAll(".work").forEach(c=>{const v=c.querySelector("video");if(!v)return;const im=c.querySelector(".media img");
    c.addEventListener("mouseenter",()=>{HOVER=v;if(HOVERDEV){if(!v.src)v.src=v.dataset.src;v.currentTime=0;v.play().then(()=>{if(HOVER===v&&im)im.style.opacity=0;}).catch(()=>{});c.classList.add("playing");}applySnd();});
    c.addEventListener("mouseleave",()=>{if(HOVER===v){HOVER=null;applySnd();}if(HOVERDEV){v.pause();if(im)im.style.opacity=1;c.classList.remove("playing");}});});
  bindSnd(document);applySnd();const hv=$("#heroVid");if(hv)attachHero(hv);
  const on=(id,f)=>{const el=$("#"+id);if(el)el.onclick=f;};
  on("editBtn",()=>{editing=true;render();});on("doneBtn",()=>{editing=false;render();});
  on("addBtn",()=>{const r=route();openForm(-1,DATA.categories.some(c=>c[0]===r)?r:DATA.categories[0][0]);});
  on("profBtn",openProfile);on("saveBtn",save);
  on("replayBtn",()=>{scrollTo(0,0);runIntro(true);});
  document.querySelectorAll(".ddb").forEach(b=>b.onclick=e=>{e.stopPropagation();b.parentNode.classList.toggle("open");});document.addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")),{once:true});
  on("mbtn",openMenu);document.querySelectorAll("nav .langb").forEach(b=>b.onclick=()=>{if(document.startViewTransition&&!RM)document.startViewTransition(()=>setLang(b.dataset.lang));else setLang(b.dataset.lang);});
  fxAfterRender();
}

addEventListener("hashchange",()=>{if(typeof pageCut==="function"&&!RM)pageCut();else{render();scrollTo(0,0);}});

function applySnd(){applying=true;

  if(HOVER&&HOVER.paused){if(!HOVER.src)HOVER.src=HOVER.dataset.src;HOVER.play().catch(()=>{});}
  document.querySelectorAll(".sndctl").forEach(c=>{const b=c.querySelector(".snd-t");const on=SND.on&&SND.vol>0;b.innerHTML=on?ICON_ON:ICON_OFF;b.classList.toggle("off",!on);b.title=on?"Mute · كتم":"Unmute · تشغيل الصوت";c.querySelector(".snd-r").value=SND.on?SND.vol:0;});

function runIntro(force){
  if(RM&&!force)return;if($(".intro2"))return;if(document.hidden&&!force)return;
  const P=DATA.profile,app=$("#app");document.body.classList.add("introing");
  const d=document.createElement("div");d.className="intro2";d.setAttribute("role","dialog");d.setAttribute("aria-label","Intro");
  d.innerHTML=`<div class="stage"><div class="cal"><canvas></canvas></div>
    <div class="cap"><span class="label">${esc(L(P,"role"))}</span><b>${AR()?"صادق الكعبي":esc(P.name.split(" ")[0])+" "+esc(P.name.split(" ").slice(-1)[0])}</b></div></div>
    <div class="disc"></div><span class="label hintx">${T("Tap for sound","اضغط للصوت")}</span>`;
  document.body.appendChild(d);
  const cal=d.querySelector(".cal"),cv=cal.querySelector("canvas"),ctx=cv.getContext("2d"),disc=d.querySelector(".disc");
  let phase=0,done=false,raf=0,timers=[];
  const ld=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src(u);});
  const finish=()=>{if(done)return;done=true;cancelAnimationFrame(raf);timers.forEach(clearTimeout);d.remove();document.body.classList.remove("introing");applySnd();const h=$("#heroVid");if(h&&UNLOCKED){h.currentTime=0;h.play().catch(()=>{});}};
  // ---- outro: red light cuts across the dot, the frame splits open like a film gate
  const outro=()=>{if(phase>=2)return;phase=2;cancelAnimationFrame(raf);timers.forEach(clearTimeout);setTimeout(finish,2600);
    const cr=cal.getBoundingClientRect();const dx=cr.left+cr.width*.291,dy=Math.round(cr.top+cr.height*.884);
    const stage=d.querySelector(".stage");
    const mkHalf=(top)=>{const h=document.createElement("div");h.className="half";const c=stage.cloneNode(true);const oc=c.querySelector("canvas");
      if(oc){const g=oc.getContext("2d");oc.width=cv.width;oc.height=cv.height;g.drawImage(cv,0,0);}
      h.appendChild(c);h.style.clipPath=top?`inset(0 0 ${innerHeight-dy}px 0)`:`inset(${dy}px 0 0 0)`;d.appendChild(h);return h;};
    const ht=mkHalf(true),hb=mkHalf(false);stage.style.visibility="hidden";
    disc.className="cutline";disc.style.cssText=`display:block;top:${dy-1}px;left:${dx}px;width:0`;
    const a1=disc.animate([{left:dx+"px",width:"0px"},{left:"0px",width:innerWidth+"px"}],{duration:520,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"});
    [ht,hb].forEach((h,k)=>h.animate([{transform:"translateY(0)"},{transform:`translateY(${k?2:-2}px)`}],{duration:520,fill:"forwards"}));
    a1.onfinish=()=>{d.classList.add("open");document.body.classList.remove("introing");
      app.animate([{transform:"scale(1.08)",filter:"brightness(.4) blur(6px)"},{transform:"scale(1)",filter:"brightness(1) blur(0)"}],{duration:1300,easing:"cubic-bezier(.2,.7,.1,1)"});
      const opt={duration:1100,easing:"cubic-bezier(.75,0,.15,1)",fill:"forwards"};
      ht.animate([{transform:"translateY(-2px)"},{transform:`translateY(${-dy-40}px)`}],opt);
      const ab=hb.animate([{transform:"translateY(2px)"},{transform:`translateY(${innerHeight-dy+40}px)`}],opt);
      disc.animate([{opacity:1,transform:"scaleY(1)"},{opacity:.9,transform:"scaleY(14)",offset:.25},{opacity:0,transform:"scaleY(40)"}],{duration:900,easing:"ease-out",fill:"forwards"});
      ab.onfinish=finish;};};
  // ---- handwriting
  const fit=()=>{const r=cal.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;};
  Promise.all([ld("media/cal-white.png"),ld("media/cal-red.png"),fetch(src("media/cal-strokes.json")).then(r=>r.json())]).then(([iw,ir,S])=>{
    if(done)return;fit();const W=cv.width,H=cv.height;
    const mk=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;return c;};
    const mW=mk(),mR=mk(),tmp=mk();const mw=mW.getContext("2d"),mr=mR.getContext("2d"),tc=tmp.getContext("2d");
    [mw,mr].forEach(c=>{c.lineCap="round";c.lineJoin="round";c.fillStyle=c.strokeStyle="#000";});
    const flat=(L)=>{const k=W/L.w,arr=[];L.s.forEach(st=>st.forEach((p,i)=>arr.push([p[0]*k,p[1]*k*(H/(L.h*k)),p[2]*k,i===0])));return arr;};
    const PW=flat(S.white),PR=flat(S.red);
    const draw=(c,arr,from,to)=>{for(let i=from;i<to;i++){const p=arr[i];const q=(!p[3]&&i>0)?arr[i-1]:null;
      if(q){c.lineWidth=p[2]*2;c.beginPath();c.moveTo(q[0],q[1]);c.lineTo(p[0],p[1]);c.stroke();}c.beginPath();c.arc(p[0],p[1],p[2],0,7);c.fill();}};
    const comp=(pen)=>{ctx.clearRect(0,0,W,H);
      tc.clearRect(0,0,W,H);tc.globalCompositeOperation="source-over";tc.drawImage(mW,0,0);tc.globalCompositeOperation="source-in";tc.drawImage(iw,0,0,W,H);ctx.drawImage(tmp,0,0);
      tc.globalCompositeOperation="source-over";tc.clearRect(0,0,W,H);tc.drawImage(mR,0,0);tc.globalCompositeOperation="source-in";tc.drawImage(ir,0,0,W,H);ctx.drawImage(tmp,0,0);
      if(pen){ctx.save();ctx.shadowColor="rgba(255,255,255,.9)";ctx.shadowBlur=18;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(pen[0],pen[1],Math.max(2,pen[2]*.45),0,7);ctx.fill();ctx.restore();}};
    const TW=1700,TR=650;let iw0=0,ir0=0;const t0=performance.now();
    const loop=t=>{if(phase>=2)return;const e=t-t0;
      const nw=Math.min(PW.length,Math.floor(PW.length*Math.min(1,e/TW)));if(nw>iw0){draw(mw,PW,iw0,nw);iw0=nw;}
      const er=Math.max(0,e-TW+150);const nr=Math.min(PR.length,Math.floor(PR.length*Math.min(1,er/TR)));if(nr>ir0){draw(mr,PR,ir0,nr);ir0=nr;}
      comp(nw<PW.length?PW[Math.max(0,nw-1)]:(nr<PR.length&&nr>0?PR[nr-1]:null));
      if(iw0>=PW.length&&ir0>=PR.length){ // fill any gaps the skeleton missed
        mw.fillRect(0,0,W,H);mr.fillRect(0,0,W,H);comp(null);d.classList.add("p3");timers.push(setTimeout(outro,900));return;}
      raf=requestAnimationFrame(loop);};
    d.classList.add("p1");raf=requestAnimationFrame(loop);
  }).catch(()=>finish());
  setTimeout(()=>{if(phase<2)outro();},6500);setTimeout(finish,10000);
  d.addEventListener("click",()=>{UNLOCKED=true;const h=d.querySelector(".hintx");if(h)h.style.opacity=0;if(phase<2)outro();});
  addEventListener("keydown",function k(e){if(e.key==="Escape"){removeEventListener("keydown",k);outro();}});
}

  $("#pf",d).onsubmit=e=>{e.preventDefault();if(i<0&&!file){$("#f_err",d).textContent="Choose a video file first.";return;}
    const q={...p,title:$("#f_title",d).value.trim(),titleAr:$("#f_titleAr",d).value.trim(),client:$("#f_client",d).value.trim(),cat:$("#f_cat",d).value,note:$("#f_note",d).value.trim(),orient};
    if(file){const id="u"+Date.now().toString(36);q.id=id;q.video=`media/${id}.mp4`;q.poster=`media/${id}.jpg`;pending[q.video]=file;localURL[q.video]=URL.createObjectURL(file);if(poster){pending[q.poster]=poster;localURL[q.poster]=URL.createObjectURL(poster);}}
    if(i>=0)DATA.projects[i]=q;else DATA.projects.unshift(q);d.close();mark();};}
function openProfile(){const P=DATA.profile;
  const d=dlg(`<form class="form" id="pp"><h3>Edit profile</h3>
  <div class="two"><label>Name<input id="p_name" value="${esc(P.name)}"></label><label>Name (Arabic)<input id="p_nameAr" dir="rtl" value="${esc(P.nameAr)}"></label></div>
  <div class="two"><label>Role<input id="p_role" value="${esc(P.role)}"></label><label>Role (Arabic)<input id="p_roleAr" dir="rtl" value="${esc(P.roleAr)}"></label></div>
  <label>About<textarea id="p_about">${esc(P.about)}</textarea></label><label>About (Arabic)<textarea id="p_aboutAr" dir="rtl">${esc(P.aboutAr)}</textarea></label>
  <div class="two"><label>Email<input id="p_email" value="${esc(P.email)}"></label><label>Phone<input id="p_phone" value="${esc(P.phone)}"></label></div>
  <div class="btns"><button type="button" id="p_cancel">Cancel</button><button class="primary" type="submit">Apply</button></div></form>`);
  $("#p_cancel",d).onclick=()=>d.close();
  $("#pp",d).onsubmit=e=>{e.preventDefault();["name","nameAr","role","roleAr","about","aboutAr","email","phone"].forEach(k=>P[k]=$("#p_"+k,d).value.trim());d.close();mark();};}

async function save(){const st=$("#status"),btn=$("#saveBtn");btn.disabled=true;st.textContent="Publishing…";
  const files={"data/portfolio.json":{content:JSON.stringify(DATA,null,1),contentType:"application/json"}};for(const k in pending)files[k]=pending[k];
  try{await artifactNS.publish(files);for(const k in pending)delete pending[k];dirty=false;render();$("#status").textContent="Published";}
  catch(e){const c=e&&e.code;st.textContent=c==="conflict"?"Someone else saved first. Reloading.":(c==="not_writer"||c==="not_granted")?"This view is read-only.":c==="capability_disabled"?"Saving isn't available here. Open the portfolio from claude.ai to edit.":"Couldn't publish: "+(e&&e.message||c||"unknown error");btn.disabled=false;}}

applyLang();render();
fetch("data/portfolio.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.projects&&j.categories&&j.logos){DATA=normData(j);render();}}).catch(()=>{});
(async()=>{try{if(!window.claude||!claude.use)return;const u=await claude.use("user");if(!(u&&await u.canEdit()))return;artifactNS=await claude.use("artifact");if(!artifactNS)return;canEdit=true;applyLang();render();}catch(e){}})();
})();
</script>
